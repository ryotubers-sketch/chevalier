
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in with Google</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f5f6fa;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #202124;
}

.container {
    background: white;
    width: 380px;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    text-align: center;
}

.logo {
    font-size: 38px;
    font-weight: bold;
    margin-bottom: 20px;
}

h2 {
    font-size: 23px;
    margin-bottom: 10px;
}

p {
    color: #666;
    font-size: 14px;
    margin-bottom: 30px;
}

.google-btn {
    width: 100%;
    padding: 13px;
    border: 1px solid #dadce0;
    background: white;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: 0.2s;
}

.google-btn:hover {
    background: #f7f8f8;
}

.google-btn img {
    width: 20px;
}

#success {
    display: none;
}

#email {
    color: #202124;
    font-weight: bold;
    word-break: break-word;
}

.signout {
    margin-top: 20px;
    padding: 11px 25px;
    border: none;
    border-radius: 7px;
    background: #202124;
    color: white;
    cursor: pointer;
}

#error {
    color: #d93025;
    font-size: 13px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div id="login">
        <div class="logo">🔐</div>

        <h2>Welcome</h2>
        <p>Sign in using your Google account to continue.</p>

        <button class="google-btn" id="googleBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
            Sign in with Google
        </button>

        <div id="error"></div>
    </div>

    <div id="success">
        <div class="logo">✅</div>
        <h2>Login Successful!</h2>
        <p>You have successfully signed in.</p>

        <p id="name"></p>
        <p id="email"></p>

        <button class="signout" id="signoutBtn">
            Sign out
        </button>
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBTqtQhMGwIpHA70Ft_23OWQxb-Wy6cd3I",
    authDomain: "chevalier-collage.firebaseapp.com",
    projectId: "chevalier-collage",
    storageBucket: "chevalier-collage.firebasestorage.app",
    messagingSenderId: "924873128628",
    appId: "1:924873128628:web:6ec41cdd9b079bb53235e1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const login = document.getElementById("login");
const success = document.getElementById("success");
const error = document.getElementById("error");

document.getElementById("googleBtn").addEventListener("click", async () => {
    error.textContent = "";

    try {
        await signInWithPopup(auth, provider);
    } catch (err) {
        error.textContent = err.message;
    }
});

onAuthStateChanged(auth, (user) => {
    if (user) {
        login.style.display = "none";
        success.style.display = "block";

        document.getElementById("name").textContent =
            "Welcome, " + (user.displayName || "User");

        document.getElementById("email").textContent =
            user.email;
    } else {
        login.style.display = "block";
        success.style.display = "none";
    }
});

document.getElementById("signoutBtn").addEventListener("click", async () => {
    await signOut(auth);
});

</script>

</body>
</html>
